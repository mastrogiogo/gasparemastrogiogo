<style>
  @font-face {
    font-family: "Noto Serif";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("fonts/noto-serif-latin-400.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Noto Serif";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("fonts/noto-serif-latin-ext-400.woff2") format("woff2");
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #000000;
    --font: "Noto Serif", Georgia, serif;   /* swap for your font here */
    --m: 1.8vw;                 /* outer margin */
    --index-left: 49.8vw;       /* where the index starts */
    --slide: 12vw;              /* how far it moves right when the work is open */
    --out: cubic-bezier(.19, 1, .22, 1);      /* expo out: fast, then settles */
    --inout: cubic-bezier(.65, 0, .35, 1);
    --red: #ff1a1a;                           /* siren red, same as the tab icon */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: clip; }   /* never scroll sideways */
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body:not(.has-project) { overflow: hidden; height: 100vh; height: 100svh; }
  html.is-opening { overflow: hidden; }   /* holds the page still while the work fades in, without undoing the jump */
  a { color: inherit; }
  button { touch-action: manipulation; }

  /* nothing selectable or savable, except the email and Instagram */
  html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  img { -webkit-user-drag: none; user-select: none; }
  .copyable { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }

  /* smooth scrolling on computers (lenis) */
  html.lenis, html.lenis body { height: auto; }
  .lenis:not(.lenis-autoToggle).lenis-stopped { overflow: clip; }
  .lenis [data-lenis-prevent] { overscroll-behavior: contain; }

  /* ---------- your text: always there, inverts over whatever is under it ---------- */
  .intro {
    position: fixed;
    z-index: 3;
    inset: 0;
    margin: 0;
    color: #fff;
    mix-blend-mode: difference;
    font-size: 2.83vw;
    line-height: 1.31;
    font-weight: 400;
    pointer-events: none;            /* clicks go through to the posters... */
  }
  .intro a { text-decoration: none; pointer-events: auto; }   /* ...except on your links */
  .intro a { outline: none; }
  /* pure red on hover: the inverted letters fade out, an un-inverted copy on top fades in as red */
  .intro a.is-red { color: transparent; }
  .intro .home.is-red { color: inherit; }
  .intro .home.is-red .mini-face { fill: transparent; }
  .intro.intro-red { mix-blend-mode: normal; color: transparent; z-index: 4; pointer-events: none; }
  .intro.intro-red a { pointer-events: none; }
  .intro.intro-red .mini-face { fill: transparent; }
  .intro.intro-red a.is-red { color: var(--red); }
  .intro.intro-red a.copyable {
    background: linear-gradient(var(--red), var(--red)) 0 calc(100% - .12em) / 0 .06em no-repeat;
  }
  .intro.intro-red a.copyable.is-red { background-size: 100% .06em; }
  .intro.intro-red .home.is-red { color: transparent; }
  .intro.intro-red .home.is-red .mini-face { fill: var(--red); }
  .home { cursor: pointer; white-space: nowrap; }
  /* each line on its own, dropped down the left like type on a poster */
  .intro .ln { position: absolute; white-space: nowrap; }
  .ln1 { top: calc(var(--m) * .55 + .3em); left: var(--m); }   /* a little lower, so the ball fits on your head */
  .ln2 { top: 27vh; left: 11vw; }
  .ln3 { top: 49vh; left: var(--m); }
  .ln4 { top: 68vh; left: 6vw; }
  .ln5 { bottom: calc(var(--m) * .7); left: 20vw; }
  /* the ball: a dot of the same white, so it inverts exactly like the text */
  .ball { position: absolute; left: 0; top: 0; width: .6em; height: .6em; border-radius: 50%; background: #fff; transform: translate3d(-200px, -200px, 0); will-change: transform; }
  .intro.intro-red .ball { display: none; }
  .mini-face { display: inline-block; height: 1.12em; width: auto; vertical-align: -.27em; margin-left: .2em; fill: #fff; }

  /* ---------- the index on the right ---------- */
  .index {
    position: fixed;
    z-index: 2;
    top: var(--m);
    bottom: var(--m);
    left: var(--index-left);
    width: calc(100vw - var(--index-left) - var(--m));
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    background: var(--paper);                 /* the work never shows through it */
    transition: transform 1.1s var(--out);
  }
  .index::-webkit-scrollbar { display: none; }
  body.has-project .index { transform: translateX(var(--slide)); }
  .list { border-bottom: 1px solid var(--ink); font-size: max(13px, 1.05vw); line-height: 1.3; }
  .row {
    display: grid;
    grid-template-columns: 4.2em 1fr auto;
    column-gap: 1.2em;
    width: 100%;
    padding: .2em 0 .25em;
    border: 0;
    border-top: 1px solid var(--ink);
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .row .type { text-align: right; }
  .row .title {
    justify-self: start;
    background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
  }
  .row:hover .title, .row:focus-visible .title, .row.is-active .title { background-size: 100% 1px; }
  @media (hover: hover) { .row:hover { color: var(--red); } }   /* red on hover, like the links */
  .row:focus-visible { outline: none; }
  .row.is-press { color: var(--red); }
  .row.is-press .title { background-size: 100% 1px; }
  .row-red { position: fixed; inset: 0; z-index: 5; pointer-events: none; color: var(--red); display: none; }
  .row-red.is-on { display: block; }
  .row-red span { position: absolute; left: 0; top: 0; display: block; }
  .row-red .title { background: linear-gradient(var(--red), var(--red)) 0 100% / 100% 1px no-repeat; }

  /* ---------- the work: every project, one after the other ---------- */
  .project {
    position: relative;
    z-index: 1;
    width: calc(var(--index-left) + var(--slide) - var(--m) * 2.4);
    margin-left: var(--m);
    padding: var(--m) 0 var(--m);
    display: none;
  }
  body.has-project .project { display: block; }
  .work + .work { margin-top: calc(var(--m) * 4); }
  .shot { display: block; margin: 0 0 var(--m); cursor: zoom-in; background: var(--tone, #ecebe8) center / cover no-repeat; }
  .shot:last-child { margin-bottom: 0; }
  .shot img { display: block; width: 100%; height: auto; }

  /* ---------- one image at a time ---------- */
  body.lb-open { overflow: hidden; }
  .lightbox { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; }
  .lightbox.is-on { display: flex; }
  .lb-bg { position: absolute; inset: 0; background: var(--paper); }
  .lb-fig { position: relative; margin: 0; display: flex; flex-direction: column; align-items: flex-start; }
  .lb-name { margin: 0 0 .45em; font-size: max(13px, 1.05vw); line-height: 1.3; }
  .lb-media img {
    display: block;
    max-width: calc(100vw - 170px);
    max-height: calc(100vh - 100px);
    max-height: calc(100svh - 100px);
    width: auto;
    height: auto;
    cursor: zoom-out;
    transform-origin: 0 0;
    will-change: transform;
  }
  .lb-btn {
    position: absolute;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    color: #8f8f8f;
    transition: color .2s ease;
  }
  .lb-btn svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.1; }
  .lb-btn:hover, .lb-btn:focus-visible { color: var(--ink); outline: none; }
  .lb-close { top: 16px; right: 18px; }
  .lb-prev  { left: 18px;  top: 50%; margin-top: -16px; }
  .lb-next  { right: 18px; top: 50%; margin-top: -16px; }
  .lightbox.single .lb-prev, .lightbox.single .lb-next { display: none; }

  .sheet-x { display: none; }   /* the phone sheet's × only exists on phones */

  /* ---------- phones ---------- */
  @media (max-width: 759px) {
    :root { --m: 14px; }
    .intro { font-size: 5.4vw; --t: calc(10px + env(safe-area-inset-top, 0px)); --l: calc(14px + env(safe-area-inset-left, 0px)); }
    .ln1 { top: calc(var(--t) + .45em); left: var(--l); }
    .ln2 { top: calc(var(--t) + 10vh); top: calc(var(--t) + 10svh); left: 21vw; }
    .ln3 { top: calc(var(--t) + 20vh); top: calc(var(--t) + 20svh); left: var(--l); }
    .ln4 { top: calc(var(--t) + 30vh); top: calc(var(--t) + 30svh); left: 8vw; }
    .ln5 { top: calc(var(--t) + 40vh); top: calc(var(--t) + 40svh); bottom: auto; left: 28vw; }
    .index {
      top: calc(var(--intro-b, 170px) + 22px);
      left: calc(14px + env(safe-area-inset-left, 0px));
      right: calc(14px + env(safe-area-inset-right, 0px));
      bottom: auto;
      width: auto;
      max-height: calc(100vh - var(--intro-b, 170px) - 40px);
      max-height: calc(100svh - var(--intro-b, 170px) - 40px);
      background: transparent;
      transform: none !important;
      transition: none;
    }
    .list { font-size: 14px; }
    .row { grid-template-columns: 3.2em 1fr auto; column-gap: .8em; padding: .35em 0 .4em; }

    /* in the work: one see-through line at the bottom that inverts, like your text */
    body.has-project .index {
      top: auto;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: none;
      padding: 0 calc(14px + env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) calc(14px + env(safe-area-inset-left, 0px));
      color: #fff;
      mix-blend-mode: difference;
      border-top: 1px solid #fff;
    }
    body.has-project .index .list { border-bottom: 0; }
    body.has-project .index .row { border-top-color: #fff; }       /* the lines never turn red */
    body.has-project .index .row:hover { color: inherit; }
    body.has-project .index .row.is-red { color: transparent; }     /* a pure red copy sits on top instead */
    body.has-project .index:not(.is-open) .row { display: none; }
    body.has-project .index:not(.is-open) .row.is-active { display: grid; border-top: 0; padding: 12px 1.8em 13px 0; }
    body.has-project .index:not(.is-open) .row.is-active:not(:hover) .title { background-size: 0 1px; }   /* underline shows on hover in the bar too */
    body.has-project .index:not(.is-open) .row.is-active .type { display: none; }
    body.has-project .index::after {
      content: "+";
      position: absolute;
      right: calc(14px + env(safe-area-inset-right, 0px));
      top: 9px;
      font-size: 19px;
      line-height: 1;
      pointer-events: none;
      transition: transform .5s var(--out);
    }
    body.has-project .index.is-open {
      max-height: 72vh;
      max-height: 72svh;
      overflow-y: auto;
      padding-top: 38px;
    }
    body.has-project .index.is-open::after { transform: rotate(45deg); }   /* + turns into × */
    body.x-hot .index.is-open::after { opacity: 0; }
    .sheet-x {                                     /* a pure red × sits exactly on top, shown on hover / press */
      position: fixed;
      z-index: 6;
      right: calc(3.5px + env(safe-area-inset-right, 0px));
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      background: none;
      color: transparent;
      font: 19px/32px var(--font);
      text-align: center;
      cursor: pointer;
      display: none;
      transform: rotate(45deg);
    }
    body.sheet-on .sheet-x { display: block; }
    body.x-hot .sheet-x { color: var(--red); }
    body.has-project .index.is-open .row:first-child { border-top: 0; }

    .project { width: auto; margin: 0 calc(14px + env(safe-area-inset-right, 0px)) 0 calc(14px + env(safe-area-inset-left, 0px)); padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
    .work + .work { margin-top: 48px; }

    .lb-media img { max-width: calc(100vw - 28px); max-height: calc(100vh - 140px); max-height: calc(100svh - 140px); }
    .lb-close { top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; }
    .lb-prev, .lb-next { top: auto; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin-top: 0; }
    .lb-prev { left: 14px; }
    .lb-next { right: 14px; }
  }

  /* ---------- the pointer: a normal arrow that inverts (mouse only) ---------- */
  .cursor {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 20;
    display: none;
    width: 15px;
    height: 23px;
    pointer-events: none;
    mix-blend-mode: difference;
    opacity: 0;
    transition: opacity .2s ease;
    will-change: transform;
  }
  .cursor svg { display: block; width: 100%; height: 100%; fill: #fff; }
  html.has-cursor, html.has-cursor * { cursor: none !important; }
  html.has-cursor .cursor { display: block; }
  .cursor.is-on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .index { transition: none !important; }
  }
</style>

      .then(function () {
        lock(true);
        body.classList.remove('has-project');
        indexEl.classList.remove('is-open');
        body.classList.remove('sheet-on', 'x-hot');
        jumpTo(0);
        setActive(-1);
        indexEl.scrollTop = 0;
        var back = isPhone()
          ? anim(indexEl, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], 520)
          : Promise.resolve();
        return back;
      })
      .then(function () { busy = false; });
  }
  document.querySelector('.home').addEventListener('click', function (e) { e.preventDefault(); reset(); });
  document.addEventListener('keydown', function (e) {
    if (lb.classList.contains('is-on')) {
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
      return;
    }
    if (e.key === 'Escape') reset();
  });

  /* ---------- pure red on the links and your face: hover on computers, press on phones ---------- */
  var redCopy = intro.cloneNode(true);
  redCopy.classList.add('intro-red');
  redCopy.setAttribute('aria-hidden', 'true');
  redCopy.querySelectorAll('a').forEach(function (a) { a.setAttribute('tabindex', '-1'); a.removeAttribute('href'); });
  intro.after(redCopy);

  /* ---------- the ball: sits on your head, then rolls along each line as you scroll,
     drops onto the next one, and falls off the bottom when you reach the end ---------- */
  var ball = intro.querySelector('.ball');
  var segs = [], total = 0, ballR = 0;
  function capTop(fs, lh) {           /* how far below the top of a line its capital letters start */
    try {
      var c = document.createElement('canvas').getContext('2d');
      c.font = fs + 'px ' + getComputedStyle(intro).fontFamily;
      var m = c.measureText('H');
      if (m.fontBoundingBoxAscent && m.actualBoundingBoxAscent) return (lh - m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2 + m.fontBoundingBoxAscent - m.actualBoundingBoxAscent;
    } catch (e) {}
    return fs * 0.33;
  }
  function buildBall() {
    var cs = getComputedStyle(intro), fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight) || fs * 1.31;
    ballR = ball.offsetWidth / 2;
    var R = ballR, off = capTop(fs, lh), d = R * 2.2;
    var face = intro.querySelector('.mini-face').getBoundingClientRect();
    var L = [{ l: face.left, r: face.right, y: face.top - R }];          /* first shelf: the top of your head */
    intro.querySelectorAll('.ln').forEach(function (el, k) {
      if (k === 0) return;
      var r = el.getBoundingClientRect();
      L.push({ l: r.left, r: r.right, y: r.top + off - R });
    });
    segs = []; total = 0;
    function add(s) { s.len = s.type === 'roll' ? Math.abs(s.x1 - s.x0) : Math.hypot(s.x1 - s.x0, s.y1 - s.y0); s.at = total; total += s.len; segs.push(s); }
    var x = (L[0].l + L[0].r) / 2;
    for (var k = 0; k < L.length; k++) {
      var cur = L[k], nxt = L[k + 1], dir;
      if (nxt) {     /* roll off whichever end drops it onto the next line */
        var inside = function (v) { return v >= nxt.l + R && v <= nxt.r - R; };
        var okR = inside(cur.r + d), okL = inside(cur.l - d);
        if (okR !== okL) dir = okR ? 1 : -1;
        else if (okR) dir = cur.r - x >= x - cur.l ? 1 : -1;
        else { var mid = (nxt.l + nxt.r) / 2; dir = Math.abs(cur.r - mid) <= Math.abs(cur.l - mid) ? 1 : -1; }
      } else dir = cur.r - x >= x - cur.l ? 1 : -1;
      var edge = dir > 0 ? cur.r : cur.l;
      if ((edge - x) * dir < 0) edge = x;
      add({ type: 'roll', x0: x, x1: edge, y: cur.y, hop: k > 0 });
      var lx, ly;
      if (nxt) { lx = Math.min(Math.max(edge + dir * d, nxt.l + R), Math.max(nxt.r - R, nxt.l + R)); ly = nxt.y; }
      else { lx = edge + dir * R * 6; ly = window.innerHeight + R * 3; }       /* the last drop: off the page */
      add({ type: 'fall', x0: edge, y0: cur.y, x1: lx, y1: ly });
      x = lx;
    }
    placeBall();
  }
  function placeBall() {
    if (!segs.length) return;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var p = body.classList.contains('has-project') && max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    var s = p * total, g = segs[segs.length - 1], R = ballR;
    for (var k = 0; k < segs.length; k++) if (s <= segs[k].at + segs[k].len) { g = segs[k]; break; }
    var u = Math.min(g.len, Math.max(0, s - g.at)), t = g.len ? u / g.len : 1, X, Y;
    if (g.type === 'roll') {
      X = g.x0 + (g.x1 - g.x0) * t; Y = g.y;
      var b = Math.min(R * 3.4, g.len * 0.7);
      if (g.hop && u < b) Y -= R * 0.9 * Math.sin(Math.PI * u / b);      /* a little bounce when it lands */
    } else {
      X = g.x0 + (g.x1 - g.x0) * t; Y = g.y0 + (g.y1 - g.y0) * t * t;    /* falls like it has weight */
    }
    ball.style.transform = 'translate3d(' + (X - R) + 'px,' + (Y - R) + 'px,0)';
  }
  var ballTick = false;
  window.addEventListener('scroll', function () {
    if (!ballTick) { ballTick = true; requestAnimationFrame(function () { ballTick = false; placeBall(); }); }
  }, { passive: true });
  window.addEventListener('resize', buildBall);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildBall);
  buildBall();
  var realLinks = intro.querySelectorAll('a'), copyLinks = redCopy.querySelectorAll('a');
  realLinks.forEach(function (a, k) {
    var on = function () { a.classList.add('is-red'); copyLinks[k].classList.add('is-red'); };
    var off = function () { a.classList.remove('is-red'); copyLinks[k].classList.remove('is-red'); };
    var offSoon = function () { setTimeout(off, 260); };
    a.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') on(); });
    a.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') off(); });
    a.addEventListener('focus', function () { if (a.matches(':focus-visible')) on(); });
    a.addEventListener('blur', off);
    a.addEventListener('touchstart', on, { passive: true });          /* iOS and Android: red while pressed */
    a.addEventListener('touchend', offSoon, { passive: true });
    a.addEventListener('touchcancel', off, { passive: true });
  });

  /* ---------- no copying or saving, except the email and Instagram ---------- */
  document.addEventListener('contextmenu', function (e) { if (!(e.target.closest && e.target.closest('.copyable'))) e.preventDefault(); });
  document.addEventListener('dragstart', function (e) { if (e.target.tagName === 'IMG') e.preventDefault(); });
  document.addEventListener('copy', function (e) {
    var sel = window.getSelection();
    var node = sel && sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
    if (!(node && node.closest && node.closest('.copyable'))) e.preventDefault();
  });

  /* ---------- the pointer ---------- */
  if (fine) {
    var arrow = document.getElementById('cursor');
    root.classList.add('has-cursor');
    window.addEventListener('pointermove', function (e) {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      arrow.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)';
      if (!arrow.classList.contains('is-on')) arrow.classList.add('is-on');
    }, { passive: true });
    root.addEventListener('mouseleave', function () { arrow.classList.remove('is-on'); });
    window.addEventListener('blur', function () { arrow.classList.remove('is-on'); });
  }
});
</script>
</body>
</html>
