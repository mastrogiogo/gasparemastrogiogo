<script>
  // Hover (or hold, on a phone) and the face melts a little. Still otherwise.
  (function () {
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var face = document.querySelector('.face');
    var art = document.getElementById('face-art');
    var map = document.getElementById('melt-map');
    var noise = document.getElementById('melt-noise');
    if (calm || !face || !map || !noise) { if (art) art.removeAttribute('filter'); return; }

    var amount = 0, target = 0, t = 0, running = false;

    function frame() {
      amount += (target - amount) * 0.08;
      t += 0.012;
      var fx = 0.011 + Math.sin(t) * 0.002;
      var fy = 0.016 + Math.cos(t * 0.8) * 0.003;
      noise.setAttribute('baseFrequency', fx.toFixed(5) + ' ' + fy.toFixed(5));
      map.setAttribute('scale', amount.toFixed(2));
      if (target === 0 && amount < 0.05) {
        map.setAttribute('scale', '0');
        running = false;
        return;
      }
      requestAnimationFrame(frame);
    }
    function go(v) {
      target = v;
      if (!running) { running = true; requestAnimationFrame(frame); }
    }

    face.addEventListener('pointerenter', function () { go(22); });
    face.addEventListener('pointerleave', function () { go(0); });
    face.addEventListener('pointerdown', function () { go(34); });
    face.addEventListener('pointerup', function (e) { go(e.pointerType === 'mouse' ? 22 : 0); });
    face.addEventListener('pointercancel', function () { go(0); });
  })();
</script>
